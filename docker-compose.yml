services:
  api:
    build:
      context: ..
      dockerfile: WaterPotability-ms/Dockerfile
    container_name: waterpotability-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Water Potability API
      APP_VERSION: 1.0.0
      MODEL_PATH: /app/models/water_potability_model
      MODEL_PATH_NN: /app/models/water_potability_model_nn
      DEFAULT_MODEL_NAME: decision_tree
      METRICS_CSV_PATH: /data/raw/water_potability.csv
      CORS_ORIGINS: '["http://localhost:4200"]'
    volumes:
      - ../WaterPotability/data/raw:/data/raw:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: ..
      dockerfile: WaterPotability-dashboard/Dockerfile
    container_name: waterpotability-dashboard
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
